name: Migration Chain

# BUILD-02 (v0.91.0): Dedicated migration chain workflow.
#
# Runs the full SQL migration chain test on every PR and push to main.
# Ensures that ALTER EXTENSION pg_ripple UPDATE works end-to-end from the
# earliest shipped version to the current default_version.
#
# Uses the same PGDG + pgrx setup as the "migration" job in ci.yml.

on:
  push:
    branches: [main, dev/develop]
    paths:
      - 'sql/**.sql'
      - 'pg_ripple.control'
      - 'tests/test_migration_chain.sh'
      - 'tests/schema_fingerprint.sh'
      - 'tests/upgrade_recovery.sh'
      - 'tests/package_upgrade_matrix.sh'
      - 'scripts/migration_graph.py'
      - 'scripts/schema_fingerprint.sql'
      - 'scripts/compare_schema_fingerprints.py'
  pull_request:
    branches: [main, dev/develop]
    paths:
      - 'sql/**.sql'
      - 'pg_ripple.control'
      - 'tests/test_migration_chain.sh'
      - 'tests/schema_fingerprint.sh'
      - 'tests/upgrade_recovery.sh'
      - 'tests/package_upgrade_matrix.sh'
      - 'scripts/migration_graph.py'
      - 'scripts/schema_fingerprint.sql'
      - 'scripts/compare_schema_fingerprints.py'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  PGRX_VERSION: "0.18.0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Disable rustup's automatic channel-update sync.  The Gitea runner
  # occasionally hits `tls handshake eof` while downloading
  # `channel-rust-*.toml.sha256` from static.rust-lang.org; with the
  # toolchain already provisioned by dtolnay/rust-toolchain@stable we
  # have no need for that check.  RUSTUP_AUTO_INSTALL=0 also keeps
  # rustup from trying to fetch a fresh toolchain if anything routes
  # through it unexpectedly.
  RUSTUP_AUTO_INSTALL: "0"

jobs:
  migration-chain:
    name: Migration chain — full upgrade path (BUILD-02, v0.91.0)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2  # v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable  # stable

      - name: Cache Cargo registry
        uses: actions/cache@v5.0.5  # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cache cargo-pgrx binary
        uses: actions/cache@v5.0.5  # v5
        with:
          path: ~/.cargo/bin/cargo-pgrx
          key: ${{ runner.os }}-cargo-pgrx-${{ env.PGRX_VERSION }}

      - name: Install PostgreSQL 18 from PGDG
        run: |
          sudo apt-get install -y --no-install-recommends curl ca-certificates lsb-release
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list /etc/apt/sources.list.d/azure-cli.sources
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libclang-dev clang lld \
            postgresql-18 postgresql-server-dev-18
          sudo chown -R "$USER" \
            /usr/share/postgresql/18/extension \
            /usr/lib/postgresql/18/lib

      - name: Install cargo-pgrx
        run: |
          if ! cargo pgrx --version 2>/dev/null | grep -q "${{ env.PGRX_VERSION }}"; then
            cargo install cargo-pgrx --version "=${{ env.PGRX_VERSION }}" --locked
          fi

      - name: Initialise pgrx (PostgreSQL 18)
        # Root-safe bootstrap: wrapper pg_ctl/initdb (re-exec as postgres
        # under root) + PGRX_HOME env + config.toml against the wrapper
        # pg_config.  See .github/actions/setup-pgrx-root.
        uses: ./.github/actions/setup-pgrx-root

      - name: Install pg_ripple candidate
        run: cargo pgrx install --pg-config /usr/lib/postgresql/18/bin/pg_config

      - name: Start pgrx PostgreSQL 18
        run: cargo pgrx start pg18 --postgresql-conf "shared_preload_libraries=pg_ripple"

      - name: Run migration chain test
        # test_migration_chain.sh resolves its host from PGRX_HOME (set by
        # the setup action) and connects as the OS user — the wrapper
        # initdb named the bootstrap superuser after this OS user.
        run: bash tests/test_migration_chain.sh

      - name: Compare fresh and upgraded schema fingerprints
        # schema_fingerprint.sh resolves its host from PGRX_HOST (not
        # PGRX_HOME), so map it explicitly here.
        env:
          PGRX_HOST: ${{ runner.temp }}/pgrx-home
        run: bash tests/schema_fingerprint.sh

      - name: Run upgrade recovery test
        env:
          PG_RIPPLE_RESILIENCE_REQUIRE_SIGKILL: "1"
        run: |
          # Wrapper bindir first: the script calls pg_ctl directly for the
          # SIGKILL restart verification, and pg_ctl refuses to run as root.
          export PATH="${PGRX_BINDIR}:/usr/lib/postgresql/18/bin:$PATH"
          export PGHOST="${PGRX_HOME}"
          export PGPORT=28818
          bash tests/upgrade_recovery.sh

      - name: Stop pgrx PostgreSQL 18
        if: always()
        run: cargo pgrx stop pg18
