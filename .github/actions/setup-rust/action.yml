# setup-rust — self-hosted (Gitea) safe Rust bootstrap
#
# Replaces dtolnay/rust-toolchain.  That action hard-codes
# static.rust-lang.org for the rustup-init download; from the Gitea LAN
# the direct connection to that host is unreliable (observed: "curl: (18)
# Transferred a partial file"), and the Aliyun mirror does not host
# rustup-init at all (observed: 404).
#
# This action:
#   1. bootstraps rustup when cargo is missing (the Gitea job containers
#      ship no Rust toolchain at all), downloading rustup-init from a
#      verified source list and executing it as an ELF binary,
#   2. installs the channel pinned by rust-toolchain.toml (TOOLCHAIN-PIN-01)
#      when present, otherwise the requested toolchain,
#   3. probes which toolchain distribution mirror is actually reachable
#      and pins it in GITHUB_ENV so every later rustup/cargo invocation
#      (including toolchain auto-installs triggered by rust-toolchain.toml)
#      uses the same mirror,
#   4. adds the requested components to the installed toolchain.
#   5. writes ~/.cargo/config.toml (CARGO_HOME) pointing the cargo registry
#      at the Aliyun sparse mirror when the file does not exist yet — the
#      self-hosted runners reach crates.io over a slow WAN route.
#   6. exports NODE_EXTRA_CA_CERTS pointing at the system CA bundle on Linux
#      so Node-based actions (upload-artifact, cache) trust the internal CA
#      that git/curl already trust — Node does not consult the system store
#      by default (observed: artifact upload to the Gitea instance failed
#      with "unable to verify the first certificate" while git over HTTPS
#      succeeded in the same container).
name: "Setup Rust (mirror-aware, self-hosted safe)"
description: "Install rustup + the pinned toolchain with verified multi-source downloads; add components"
inputs:
  toolchain:
    description: "Rust toolchain to install (stable by default; rust-toolchain.toml wins when present)"
    default: "stable"
  components:
    description: "Comma-separated rustup components to install (e.g. rustfmt, clippy, rust-src)"
    default: ""

runs:
  using: composite
  steps:
    # ── Node.js trust of the system CA bundle ────────────────────────
    # Node-based actions (upload-artifact, cache) verify TLS against Node's
    # bundled Mozilla roots and ignore the system store, so uploads to a
    # Gitea instance behind an internal CA fail with "unable to verify the
    # first certificate" even though git/curl in the same container
    # succeed. Exporting NODE_EXTRA_CA_CERTS (Linux only, file-existence
    # guarded — no-op on GitHub-hosted, macOS, and Windows runners) makes
    # Node append the system bundle to its trusted roots. This must run
    # before any upload/cache step, and setup-rust is the first step of
    # every job that uses those actions.
    - name: Trust system CA bundle in Node actions
      shell: bash
      run: |
        if [ "$(uname -s)" = "Linux" ] && [ -f /etc/ssl/certs/ca-certificates.crt ]; then
          echo "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt" >> "${GITHUB_ENV:-/dev/null}"
          echo "exported NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt"
        fi

    # ── Cargo registry mirror ────────────────────────────────────────
    # Point the cargo registry at the Aliyun sparse mirror for faster
    # dependency downloads on the self-hosted Gitea runners. The config is
    # written once per job container as $CARGO_HOME/config.toml and never
    # overwrites a config already baked into the runner image. Only
    # `replace-with = 'aliyun'` takes effect; the other [source.*] blocks
    # are standby fallbacks. Note: the repo-local .cargo/config.toml only
    # sets [env]/[target], so the two files merge without conflict.
    - name: Configure cargo registry mirror (Aliyun)
      shell: bash
      run: |
        set -euo pipefail
        CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        CONFIG="$CARGO_HOME/config.toml"
        mkdir -p "$CARGO_HOME"
        if [ -f "$CONFIG" ]; then
          echo "$CONFIG already exists; leaving it untouched"
          exit 0
        fi
        cat > "$CONFIG" <<'EOF'
        [source.crates-io]
        # Fetch crates from the Aliyun mirror instead of crates.io; switch
        # `replace-with` to a standby source below to fall back elsewhere.
        replace-with = 'aliyun'
        [source.aliyun]
        registry = "sparse+https://mirrors.aliyun.com/crates.io-index/"
        [source.ustc]
        registry = "https://mirrors.ustc.edu.cn/crates.io-index"
        [source.sjtu]
        registry = "https://mirrors.sjtug.sjtu.edu.cn/git/crates.io-index/"
        [source.tuna]
        registry = "https://mirrors.tuna.tsinghua.edu.cn/git/crates.io-index.git"
        [source.rustcc]
        registry = "https://code.aliyun.com/rustcc/crates.io-index.git"
        [http]
        timeout = 30
        check-revoke = false
        EOF
        echo "wrote $CONFIG (crates.io -> Aliyun sparse mirror)"

    - name: Ensure rustup, pinned toolchain and components
      shell: bash
      run: |
        set -o pipefail
        case "$(uname -m)" in
          x86_64)  target=x86_64-unknown-linux-gnu ;;
          aarch64) target=aarch64-unknown-linux-gnu ;;
          *)       target="$(rustc -vV 2>/dev/null | awk '/host/ {print $2}')" ;;
        esac
        CARGO_HOME="${CARGO_HOME:-$HOME/.cargo}"
        RUSTUP_HOME="${RUSTUP_HOME:-$HOME/.rustup}"
        export RUSTUP_HOME CARGO_HOME

        # ------------------------------------------------------------------
        # 0. requested toolchain: the rust-toolchain.toml pin wins
        # ------------------------------------------------------------------
        TC="${{ inputs.toolchain }}"
        COMPONENTS="${{ inputs.components }}"
        if [ "$TC" = "stable" ] && [ -f rust-toolchain.toml ]; then
          pinned="$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml | head -1)"
          if [ -n "$pinned" ]; then
            echo "rust-toolchain.toml pins channel $pinned; installing that instead of the latest stable"
            TC="$pinned"
          fi
        fi

        # ------------------------------------------------------------------
        # 1. rustup itself (only when cargo is missing entirely)
        # ------------------------------------------------------------------
        if ! command -v cargo >/dev/null 2>&1 || ! command -v rustup >/dev/null 2>&1; then
          echo "installing rustup (target: $target)"
          # rustup-init is an ELF *binary* upstream -- it must be executed
          # directly, never piped through `sh` (observed failure:
          # "/tmp/rustup-init: 1: ELF: not found").
          fetch_ok=0
          for base in \
            "https://static.rust-lang.org/rustup/dist" \
            "https://rsproxy.cn/rustup/dist"; do
            url="${base}/${target}/rustup-init"
            echo "trying $url"
            if curl -fL --retry 3 --retry-connrefused --retry-all-errors \
                --connect-timeout 15 --max-time 600 -o /tmp/rustup-init "$url" \
               && [ -s /tmp/rustup-init ] \
               && head -c4 /tmp/rustup-init | grep -q "ELF"; then
              chmod +x /tmp/rustup-init
              if /tmp/rustup-init -y --profile minimal --default-toolchain none; then
                fetch_ok=1
                break
              fi
            else
              echo "source failed or payload is not an ELF binary; trying the next one"
            fi
          done
          if [ "$fetch_ok" -ne 1 ]; then
            echo "error: every rustup-init source failed; check the runner's outbound network"
            exit 1
          fi
          if [ -n "${GITHUB_PATH:-}" ]; then
            echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          fi
          export PATH="$CARGO_HOME/bin:$PATH"
        fi

        # ------------------------------------------------------------------
        # 2+3. install the toolchain.  The official distribution server is
        #      tried first: it is the only source that keeps channel files
        #      for older releases (mirrors routinely prune them, so the
        #      rust-toolchain.toml pin, e.g. 1.95.0, only exists upstream).
        #      Mirrors are probed afterwards as fallbacks for when the
        #      direct connection misbehaves; whichever source installs
        #      successfully is pinned in GITHUB_ENV so every later rustup/
        #      cargo invocation keeps using it.
        # ------------------------------------------------------------------
        sources=("${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}")
        for base in \
          "https://mirrors.aliyun.com/rustup" \
          "https://rsproxy.cn/rustup" \
          "https://mirrors.tuna.tsinghua.edu.cn/rustup"; do
          url="${base}/dist/channel-rust-${TC}"
          if curl -fsS -o /dev/null --max-time 10 "$url"; then
            sources+=("$base")
            echo "toolchain mirror probe OK: $url"
          else
            echo "toolchain mirror probe failed: $url"
          fi
        done

        installed=0
        for src in "${sources[@]}"; do
          echo "installing toolchain $TC from $src"
          if RUSTUP_DIST_SERVER="$src" RUSTUP_MAX_RETRIES=5 \
              rustup toolchain install "$TC" --profile minimal; then
            installed=1
            break
          fi
          echo "install failed against $src; trying the next source"
        done
        if [ "$installed" -ne 1 ]; then
          echo "error: toolchain $TC could not be installed from any source" >&2
          exit 1
        fi
        if [ -n "${GITHUB_ENV:-}" ] && [ -n "$src" ] && \
           [ "$src" != "${RUSTUP_DIST_SERVER:-https://static.rust-lang.org}" ]; then
          echo "RUSTUP_DIST_SERVER=$src" >> "$GITHUB_ENV"
        fi
        rustup default "$TC"
        for c in $(echo "$COMPONENTS" | tr ',' ' '); do
          [ -n "$c" ] || continue
          rustup component add "$c" --toolchain "$TC"
        done
        rustup show active-toolchain
        echo "rustc: $(rustc --version)"
        echo "cargo: $(cargo --version)"