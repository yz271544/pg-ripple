name: Set up Rust toolchain
description: >-
  Ensure rustup and the requested toolchain are available.  The Gitea Actions
  Ubuntu image ships cargo/rustc but not rustup, and direct connections from
  the LAN to static.rust-lang.org are unreliable (curl 18 partial-file
  failures), so this action installs rustup from the Aliyun mirror (with the
  official URL as fallback) and configures RUSTUP_DIST_SERVER/RUSTUP_UPDATE_ROOT
  so every subsequent toolchain and component download goes through the
  mirror.  Replaces dtolnay/rust-toolchain, which hard-codes the official
  download URL and failed on the Gitea runner.

inputs:
  toolchain:
    description: "Toolchain to install (default is stable; fuzz uses nightly)"
    required: false
    default: stable
  components:
    description: "Comma-separated rustup components to add (e.g. 'rustfmt, clippy' or 'rust-src')"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Ensure rustup and stable toolchain (mirror-first)
      shell: bash
      env:
        RUSTUP_DIST_SERVER: https://mirrors.aliyun.com/rustup
        RUSTUP_UPDATE_ROOT: https://mirrors.aliyun.com/rustup/rustup
      run: |
        set -o pipefail
        case "$(uname -m)" in
          x86_64) target=x86_64-unknown-linux-gnu ;;
          aarch64) target=aarch64-unknown-linux-gnu ;;
          *) target="$(rustc -vV 2>/dev/null | awk '/host/ {print $2}')" ;;
        esac
        TC="${{ inputs.toolchain }}"
        COMPONENTS="${{ inputs.components }}"

        ensure_rustup() {
          command -v rustup >/dev/null 2>&1 && return 0
          echo "installing rustup from the mirror (target: $target)"
          curl -fsSL --retry 5 --retry-connrefused \
            "${RUSTUP_UPDATE_ROOT}/${target}/rustup-init" -o /tmp/rustup-init \
            || curl -fsSL --retry 5 --retry-connrefused \
            "https://static.rust-lang.org/rustup/dist/${target}/rustup-init" -o /tmp/rustup-init
          sh /tmp/rustup-init -y --profile minimal --default-toolchain none
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
        }

        # rust-toolchain.toml (TOOLCHAIN-PIN-01) pins builds to a specific
        # stable release that the Gitea image ships preinstalled.  The
        # default path (stable, no components) therefore needs no network at
        # all.  rustup (fetched from the Aliyun mirror, official URL as
        # fallback) is only invoked for non-stable toolchains or missing
        # components; RUSTUP_DIST_SERVER routes any resulting downloads to
        # the mirror.
        if [ "$TC" = "stable" ] && [ -z "$COMPONENTS" ]; then
          echo "using the preinstalled toolchain: $(rustc --version 2>/dev/null || echo 'rustc not found')"
          exit 0
        fi

        ensure_rustup
        if [ "$TC" != "stable" ]; then
          rustup toolchain install "$TC" --profile minimal
        fi
        for c in $(echo "$COMPONENTS" | tr ',' ' '); do
          [ -n "$c" ] || continue
          # rust-src is a component without a binary; check the component
          # list instead of the PATH.
          if [ "$c" = "rust-src" ]; then
            rustup component list --toolchain "$TC" 2>/dev/null | grep -q "rust-src.*installed" \
              || rustup component add "$c" -t "$TC"
          elif ! command -v "$c" >/dev/null 2>&1; then
            # Add to the active (pinned, rust-toolchain.toml) toolchain so
            # we do not pull a second full toolchain; the download goes
            # through RUSTUP_DIST_SERVER (mirror).
            rustup component add "$c" || rustup component add "$c" -t "$TC"
          fi
        done
        rustup show active-toolchain