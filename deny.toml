# cargo deny configuration (updated for cargo-deny >= 0.16 format)
#
# https://embarkstudios.github.io/cargo-deny/
# Migration from old format: see https://github.com/EmbarkStudios/cargo-deny/pull/611

[advisories]
# "all" checks both workspace and transitive crates; "none" disables.
# vulnerability, notice fields were removed in cargo-deny 0.16 — vuln checking
# is always active and controlled by the ignore list below.
unmaintained = "none"
yanked = "deny"

# Temporary upstream advisories that have been triaged and mitigated locally.
# Review before each release and remove once compatible fixed releases exist.
ignore = [
    # rio_xml 0.8.6 pins quick-xml 0.36 and the Oxigraph dev dependency pins
    # quick-xml 0.37. Runtime RDF/XML entry points reject start tags over 64 KiB,
    # bounding both attack paths until rio_xml can be replaced by oxrdfxml built
    # on quick-xml >=0.41. The second affected copy is test-only.
    { id = "RUSTSEC-2026-0194", reason = "upstream version constraint; runtime RDF/XML start-tag size is locally bounded" },
    { id = "RUSTSEC-2026-0195", reason = "upstream version constraint; runtime RDF/XML start-tag size is locally bounded" },
]

[licenses]
# Allow OSI-approved and widely-used permissive / weak-copyleft licences.
# Licenses not in this list will be denied (cargo-deny default behaviour).
# NOTE: deny[], copyleft, allow-osi-fsf-free removed in cargo-deny 0.16.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
# Disallow multiple versions of the same crate unless explicitly skipped.
multiple-versions = "warn"
# Disallow wildcard dependencies.
wildcards = "deny"
# Known duplicate-version exceptions (indirect, pinned by different dep trees).
skip = []

[sources]
# Only allow crates from crates.io; no git or path deps in the published crate.
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
